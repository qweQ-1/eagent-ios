name: EAgent
options:
  bundleIdPrefix: com.qweq-1
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic

targets:
  EAgent:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EAgent
    info:
      path: EAgent/Info.plist
      properties:
        CFBundleDisplayName: "iAgent"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: "iAgent 需要写入相册权限，才能把你生成的图片保存到相册。"
        NSCalendarsUsageDescription: "iAgent 需要访问日历，才能替你添加日程。"
        NSCalendarsFullAccessUsageDescription: "iAgent 需要完整访问日历，才能替你添加日程。"
        NSRemindersUsageDescription: "iAgent 需要访问提醒事项，才能替你添加待办。"
        NSRemindersFullAccessUsageDescription: "iAgent 需要完整访问提醒事项，才能替你添加待办。"
        NSLocationWhenInUseUsageDescription: "iAgent 需要定位权限，才能回答你现在在哪。"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        LSApplicationQueriesSchemes:
          - shortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qweq-1.eagent
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"

  EAgentTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EAgentTests
    dependencies:
      - target: EAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qweq-1.eagent.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/EAgent.app/EAgent"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  EAgent:
    build:
      targets:
        EAgent: all
        EAgentTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EAgentTests
